# CD publishes a source bundle and checksum as release assets. This project
# has no external hosting target configured, so the workflow delivers a
# reproducible, downloadable release instead of deploying to an unknown host.
name: CD - Release bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package (for example, v1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-release:
    name: Package and publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Create source archive and SHA-256 checksum
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix="team4-bookstore-${RELEASE_TAG}/" --output="dist/team4-bookstore-${RELEASE_TAG}.zip" "${RELEASE_TAG}"
          sha256sum "dist/team4-bookstore-${RELEASE_TAG}.zip" > "dist/team4-bookstore-${RELEASE_TAG}.zip.sha256"

      - name: Upload release assets to GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: gh release upload "${RELEASE_TAG}" "dist/team4-bookstore-${RELEASE_TAG}.zip" "dist/team4-bookstore-${RELEASE_TAG}.zip.sha256" --clobber

      - name: Upload the bundle as a workflow artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          path: dist/*

      - name: Summarize CD actions
        if: always()
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          ARTIFACT_RESULT: ${{ steps.artifact.outcome }}
          JOB_RESULT: ${{ job.status }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          {
            echo "## CD release summary"
            echo
            echo "**Overall result:** ${JOB_RESULT}"
            echo "**Release tag:** `${RELEASE_TAG}`"
            echo "**Run:** [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "| Action | Result |"
            echo "|---|---|"
            echo "| Check out release tag | ${CHECKOUT_RESULT:-not run} |"
            echo "| Create ZIP and SHA-256 checksum | ${PACKAGE_RESULT:-not run} |"
            echo "| Upload assets to GitHub Release | ${PUBLISH_RESULT:-not run} |"
            echo "| Upload workflow artifact | ${ARTIFACT_RESULT:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
